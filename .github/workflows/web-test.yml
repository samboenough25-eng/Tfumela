name: Tfumela Web Tests

on:
  push:
    paths:
      - "web/**"
      - ".github/workflows/web-test.yml"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web-test.yml"
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
