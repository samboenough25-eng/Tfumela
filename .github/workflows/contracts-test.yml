name: Tfumela Contract Tests

on:
  push:
    paths:
      - "contracts/**"
      - ".github/workflows/contracts-test.yml"
  pull_request:
    paths:
      - "contracts/**"
      - ".github/workflows/contracts-test.yml"
  workflow_dispatch:

jobs:
  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Compile
        run: npx hardhat compile
      - name: Test
        run: npm test
